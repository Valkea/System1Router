name: release

# On a version tag (v0.2.0), builds the system1router binary for Linux and
# Apple Silicon macOS and attaches the archives and their checksums to a GitHub release,
# which install.sh downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime's prebuilt library needs glibc 2.38: Ubuntu 24.04 or newer.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # No Intel macOS build: ONNX Runtime ships no prebuilt library for it.
          - { target: aarch64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --quiet
      - run: cargo build --release --locked
      - run: tar -czf system1router-${{ matrix.target }}.tar.gz -C target/release system1router
      - uses: actions/upload-artifact@v5
        with:
          name: system1router-${{ matrix.target }}
          path: system1router-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - run: sha256sum system1router-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" system1router-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
