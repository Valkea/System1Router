[package]
name = "system1router"
version = "0.1.4"
edition = "2021"
description = "Sets the reasoning effort of each Claude Code or OpenCode prompt with a local classifier"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/Valkea/System1Router"
readme = "README.md"
keywords = ["claude-code", "opencode", "llm", "router", "effort"]
categories = ["command-line-utilities", "development-tools"]
# The model is downloaded from Hugging Face on first use; the crate keeps the
# sources the binary embeds.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/config.example.json", "/docs/*.md",
           "/.opencode/plugins/system1router/*.ts", "!/.opencode/plugins/system1router/*.test.ts",
           "/claude-code/system1router/.claude-plugin/plugin.json", "/claude-code/system1router/hooks/*", "/claude-code/system1router/types/*", "/claude-code/system1router/tsconfig.json"]

[lib]
name = "system1router_core"
path = "src/lib.rs"

[[bin]]
name = "system1router"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-17"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3.13"
