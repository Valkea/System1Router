[package]
name = "system1router"
version = "0.1.0"
edition = "2021"
description = "Context-aware model routing for AI coding clients"
license = "MIT"
rust-version = "1.78"

[lib]
name = "system1router_core"
path = "src/lib.rs"

[[bin]]
name = "system1router"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-17"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3.13"
